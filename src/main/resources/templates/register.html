<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Регистрация | TA&CO Interior Design</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/register.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">

  <div class="container">

    <a class="navbar-brand" th:href="@{/}">
      TA&CO
    </a>

    <div class="ms-auto">

      <a th:href="@{/users/login}" class="btn btn-outline-light">
        Вход
      </a>

    </div>

  </div>

</nav>

<section class="register-section">

  <div class="container">

    <div class="card register-card">

      <div class="card-body p-5">

        <h2 class="text-center mb-2">
          Създай профил
        </h2>

        <p class="text-center text-muted mb-4">
          Започнете своето интериорно приключение с TA&CO.
        </p>

        <form
                th:action="@{/users/register}"
                th:object="${userRegisterDTO}"
                method="post">


          <div class="alert alert-danger"
               th:if="${registerError}"
               th:text="${registerError}">
          </div>


          <div class="mb-3">

            <label class="form-label">Име</label>

            <input
                    type="text"
                    class="form-control"
                    th:field="*{firstName}">

            <small class="text-danger"
                   th:errors="*{firstName}">
            </small>

          </div>

          <div class="mb-3">

            <label class="form-label">Фамилия</label>

            <input
                    type="text"
                    class="form-control"
                    th:field="*{lastName}">

            <small class="text-danger"
                   th:errors="*{lastName}">
            </small>

          </div>

          <div class="mb-3">

            <label class="form-label">Потребителско име</label>

            <input
                    type="text"
                    class="form-control"
                    th:field="*{username}">

            <small class="text-danger"
                   th:errors="*{username}">
            </small>

          </div>

          <div class="mb-3">

            <label class="form-label">Имейл</label>

            <input
                    type="email"
                    class="form-control"
                    th:field="*{email}">

            <small class="text-danger"
                   th:errors="*{email}">
            </small>

          </div>

          <div class="mb-3">

            <label class="form-label">Парола</label>

            <input
                    type="password"
                    class="form-control"
                    th:field="*{password}">

            <small class="text-danger"
                   th:errors="*{password}">
            </small>

          </div>

          <div class="mb-4">

            <label class="form-label">
              Потвърди парола
            </label>

            <input
                    type="password"
                    class="form-control"
                    th:field="*{confirmPassword}">

            <small class="text-danger"
                   th:errors="*{confirmPassword}">
            </small>

          </div>

          <button
                  type="submit"
                  class="btn gold-btn w-100">

            Регистрация

          </button>

        </form>

        <div class="text-center mt-4">

                    <span class="text-muted">
                        Вече имате профил?
                    </span>

          <a th:href="@{/users/login}">
            Влезте тук
          </a>

        </div>

      </div>

    </div>

  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
