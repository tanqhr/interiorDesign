<!DOCTYPE html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Известия | TA&CO</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1 class="mb-0">
            🔔 Известия
        </h1>

        <a th:href="@{/}"
           class="btn btn-outline-secondary">
            Начало
        </a>

    </div>


    <!-- Няма известия -->
    <div th:if="${#lists.isEmpty(notifications)}"
         class="alert alert-light border">

        Нямате нови известия.

    </div>

    <!-- Известия -->
    <a th:each="notification : ${notifications}"
       th:href="@{/notifications/{notificationId}(notificationId=${notification.id})}"
       class="text-decoration-none text-dark">

        <div class="card mb-3 shadow-sm"
             th:classappend="${!notification.read} ? 'border-primary' : ''">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-start">

                    <div>

                        <!-- Непрочетено -->
                        <span th:if="${!notification.read}"
                              class="badge bg-primary mb-2">
                        Ново
                    </span>

                        <h5 class="card-title"
                            th:text="${notification.project.title}">
                            Име на проекта
                        </h5>

                        <p class="card-text"
                           th:text="${notification.message}">
                            Съобщение
                        </p>

                        <small class="text-muted"
                               th:text="${#temporals.format(
                               notification.createdAt,
                               'dd.MM.yyyy HH:mm'
                           )}">
                            24.08.2026 15:20
                        </small>

                    </div>

                </div>

            </div>

        </div>

    </a>

</div>

</body>
</html>
