<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Вход | TA&CO Interior Design</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


  <link rel="stylesheet" th:href="@{/login.css}">

</head>


<body>


<nav class="navbar navbar-dark">

  <div class="container">

    <a class="navbar-brand" th:href="@{/}">
      TA&CO
    </a>


    <a class="btn btn-outline-light"
       th:href="@{/users/register}">
      Регистрация
    </a>

  </div>

</nav>



<section class="login-section">


  <div class="login-card">


    <h2>
      Добре дошли обратно
    </h2>


    <p class="subtitle">
      Влезте във вашия профил и продължете проекта си.
    </p>



    <div th:if="${param.error}"
         class="alert alert-danger">

      Невалидно потребителско име или парола.

    </div>


    <div th:if="${param.logout}"
         class="alert alert-success">

      Успешно излязохте от профила.

    </div>



    <form th:action="@{/users/login}"
          method="post">



      <div class="mb-3">

        <label>
          Имейл
        </label>

        <input type="email"
               name="email"
               class="form-control"
               placeholder="Въведете имейл">

      </div>



      <div class="mb-4">

        <label>
          Парола
        </label>

        <input type="password"
               name="password"
               class="form-control"
               placeholder="Въведете парола">

      </div>



      <button type="submit"
              class="btn gold-btn w-100">

        Вход

      </button>


    </form>



    <div class="register-link">

      Нямате профил?

      <a th:href="@{/users/register}">
        Създайте акаунт
      </a>

    </div>


  </div>


</section>


</body>

</html>
