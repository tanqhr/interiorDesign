<!DOCTYPE html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>
        TA&CO Dashboard
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/home.css}">

</head>


<body>


<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand" th:href="@{/}">
            TA&CO
        </a>


        <form th:action="@{/logout}"
              method="post">

            <button class="btn btn-outline-light">
                Изход
            </button>

        </form>

    </div>

</nav>



<div class="container mt-5">


    <div class="welcome-box">


        <h1>
            Добре дошли,
            <span th:text="${firstName}">!
        </h1>


        <p>
            Управлявайте вашите интериорни проекти и идеи.
        </p>


        <a th:href="@{/projects/create}"
           class="btn gold-btn">
            + Нов проект
        </a>



    </div>




    <h2 class="mt-5">
        Моите проекти
    </h2>



    <div class="row mt-4">


        <div class="col-md-4">


            <div class="project-card">


                <img src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c"
                     class="img-fluid">


                <div class="p-3">

                    <h4>
                        Модерен хол
                    </h4>


                    <button class="btn btn-dark">
                        Отвори
                    </button>

                </div>


            </div>


        </div>





        <div class="col-md-4">


            <div class="project-card">


                <img src="https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea"
                     class="img-fluid">


                <div class="p-3">

                    <h4>
                        Кухненски дизайн
                    </h4>


                    <button class="btn btn-dark">
                        Отвори
                    </button>

                </div>


            </div>


        </div>




    </div>



</div>



</body>

</html>
