<!DOCTYPE html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>
        TA&CO Dashboard
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/home.css}">

</head>


<body>


<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand" th:href="@{/}">
            TA&CO
        </a>


        <form th:action="@{/logout}"
              method="post">

            <button class="btn btn-outline-light">
                Изход
            </button>

        </form>

    </div>

</nav>



<div class="container mt-5">


    <div class="welcome-box">


        <h1>
            Добре дошли,
            <span th:text="${firstName}">!
        </h1>


        <p>
            Управлявайте вашите интериорни проекти и идеи.
        </p>


        <a th:href="@{/projects/create}"
           class="btn gold-btn">
            + Нов проект
        </a>



    </div>




    <h2 class="mt-5">
        Моите проекти
    </h2>



    <div class="row mt-4">

        <div class="col-md-4"
             th:each="project : ${projects}">


            <div class="project-card">

                <div th:if="${!project.images.isEmpty()}">
                    <img th:src="@{'/' + ${project.images[0].filePath}}"
                         class="img-fluid">
                </div>

                <div th:if="${project.images.isEmpty()}">
                    <img src="/images/interiorDesign.jpg"
                         class="img-fluid">
                </div>


                <div class="p-3">

                    <h4 th:text="${project.title}">
                        Име на проект
                    </h4>

                    <a th:href="@{/projects/{id}(id=${project.id})}"
                       class="btn btn-dark">
                        Отвори
                    </a>

                    <a th:if="${project.price != null
                   and project.status.name() == 'PENDING_PAYMENT'}"

                       th:href="@{/payment/{id}(id=${project.id})}"

                       class="btn gold-btn ms-2">

                        Плати

                    </a>

                    <span th:if="${project.status.name() == 'PAID'}"
                          class="badge bg-success p-2">

            Платено — очаква се качване

        </span>


                    <!-- ДИЗАЙНЪТ СЕ ИЗРАБОТВА -->

                    <span th:if="${project.status.name() == 'DESIGN_IN_PROGRESS'}"
                          class="badge bg-warning text-dark p-2">

            Дизайнът се изработва

        </span>


                    <!-- ГОТОВ ДИЗАЙН -->

                    <a th:if="${project.status.name() == 'DESIGN_READY'}"

                       th:href="@{/projects/{id}(id=${project.id})}"

                       class="btn btn-success">

                        Виж дизайна

                    </a>


                </div>

            </div>
            </div>

        </div>

    </div>





</body>

</html>
