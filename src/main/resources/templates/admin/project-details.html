<!DOCTYPE html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Проект</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/admin.css}">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/admin}">
            TA&CO Admin
        </a>

        <a class="btn btn-outline-light"
           th:href="@{/admin/projects}">
            ← Всички проекти
        </a>

    </div>

</nav>

<div class="container py-5">

    <div class="row">

        <!-- Информация -->

        <div class="col-lg-7">

            <div class="card shadow-sm mb-4">

                <div class="card-body">

                    <h2 th:text="${project.title}"></h2>

                    <hr>

                    <h5>Клиент</h5>

                    <p>
                        <strong>Име:</strong>
                        <span th:text="${project.clientName}"></span>
                    </p>

                    <p>
                        <strong>Email:</strong>
                        <span th:text="${project.clientEmail}"></span>
                    </p>

                    <hr>

                    <h5>Проект</h5>

                    <p>
                        <strong>Помещение:</strong>

                        <span
                                th:text="#{${'roomType.' + project.roomType.name()}}">
                        </span>

                    </p>

                    <p>
                        <strong>Услуга:</strong>

                        <span
                                th:text="#{${'serviceType.' + project.serviceType.name()}}">
                        </span>

                    </p>

                    <p>
                        <strong>Бюджет:</strong>

                        <span
                                th:text="${project.budget + ' лв.'}">
                        </span>

                    </p>

                    <hr>

                    <h5>Описание</h5>

                    <p th:text="${project.description}"></p>

                </div>

            </div>

        </div>

        <!-- Админ -->

        <div class="col-lg-5">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h4>Управление</h4>

                    <form
                            th:action="@{/admin/projects/{id}(id=${project.id})}"
                            method="post">

                        <div class="mb-3">

                            <label class="form-label">
                                Цена
                            </label>

                            <input
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="price"
                                    th:value="${project.price}">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Статус
                            </label>

                            <select
                                    class="form-select"
                                    name="status">

                                <option
                                        th:each="status : ${statuses}"
                                        th:value="${status}"
                                        th:text="${status}"
                                        th:selected="${status == project.status}">
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Бележка
                            </label>

                            <textarea
                                    rows="5"
                                    class="form-control"
                                    name="adminNote"
                                    th:text="${project.adminNote}">
                            </textarea>

                        </div>

                        <button
                                class="btn btn-dark w-100">

                            Запази

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <!-- Снимки -->

    <div class="card shadow-sm mt-4">

        <div class="card-body">

            <h4>Снимки</h4>

            <div class="row">

                <div class="col-md-4 mb-3"
                     th:each="image : ${project.images}">

                    <img

                            th:src="@{'/' + ${image.filePath}}"
                            class="img-fluid rounded shadow">

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
