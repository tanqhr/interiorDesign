<!DOCTYPE html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Управление на FAQ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">
</head>

<body>

<div class="container py-5">

    <!-- Заглавие -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1>Често задавани въпроси</h1>
            <p class="text-muted mb-0">
                Управление на въпросите и отговорите в сайта
            </p>
        </div>

        <button class="btn btn-primary"
                type="button"
                onclick="openAddModal()">
            + Добави FAQ
        </button>

    </div>


    <!-- Съобщение -->
    <div id="message"
         class="alert d-none"
         role="alert">
    </div>


    <!-- Таблица -->
    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Въпрос</th>
                        <th>Категория</th>
                        <th>Статус</th>
                        <th class="text-end">Действия</th>
                    </tr>
                    </thead>

                    <tbody id="faqTableBody">

                    <tr>
                        <td colspan="5"
                            class="text-center text-muted py-4">
                            Зареждане...
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<!-- ===================================================== -->
<!-- MODAL - Добавяне / редактиране -->
<!-- ===================================================== -->

<div class="modal fade"
     id="faqModal"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title"
                    id="faqModalTitle">
                    Добавяне на FAQ
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <input type="hidden"
                       id="faqId">


                <!-- Въпрос -->
                <div class="mb-3">

                    <label for="question"
                           class="form-label">
                        Въпрос
                    </label>

                    <input type="text"
                           id="question"
                           class="form-control"
                           placeholder="Въведете въпроса"
                           required>

                </div>


                <!-- Отговор -->
                <div class="mb-3">

                    <label for="answer"
                           class="form-label">
                        Отговор
                    </label>

                    <textarea id="answer"
                              class="form-control"
                              rows="5"
                              placeholder="Въведете отговора"
                              required>
                    </textarea>

                </div>


                <!-- Категория -->
                <div class="mb-3">

                    <label for="category"
                           class="form-label">
                        Категория
                    </label>

                    <input type="text"
                           id="category"
                           class="form-control"
                           placeholder="Например: Цени и бюджет">

                </div>


                <!-- Активен -->
                <div class="form-check">

                    <input class="form-check-input"
                           type="checkbox"
                           id="active"
                           checked>

                    <label class="form-check-label"
                           for="active">
                        Активен
                    </label>

                </div>

            </div>


            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Отказ
                </button>

                <button type="button"
                        class="btn btn-primary"
                        onclick="saveFaq()">
                    Запази
                </button>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<!-- FAQ JavaScript -->
<script th:src="@{/js/admin-faq.js}"></script>

</body>
</html>
