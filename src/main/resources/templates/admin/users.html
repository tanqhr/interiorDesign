<!DOCTYPE html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Потребители | TA&CO Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/admin.css}">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/admin}">
            TA&CO Admin
        </a>

        <a class="btn btn-outline-light"
           th:href="@{/admin}">
            ← Табло
        </a>

    </div>

</nav>


<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1>Потребители</h1>

            <p class="text-muted mb-0">
                Управление на клиентите в системата
            </p>
        </div>

    </div>


    <div class="card shadow-sm">

        <div class="card-body">

            <div th:if="${users == null or users.isEmpty()}"
                 class="text-center py-5">

                <h4>Няма регистрирани потребители</h4>

                <p class="text-muted">
                    Все още няма потребители в системата.
                </p>

            </div>


            <div th:if="${users != null and !users.isEmpty()}"
                 class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead>

                    <tr>

                        <th>#</th>

                        <th>Име</th>

                        <th>Email</th>

                        <th>Статус</th>

                        <th class="text-end">
                            Действие
                        </th>

                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="user : ${users}">

                        <td th:text="${user.id}">
                            1
                        </td>


                        <td>

                            <strong
                                    th:text="${user.firstName + ' ' + user.lastName}">
                                Иван Иванов
                            </strong>

                        </td>


                        <td th:text="${user.email}">
                            user@email.com
                        </td>


                        <td>

                            <span th:if="${user.active}"
                                  class="badge bg-success">

                                Активен

                            </span>

                            <span th:unless="${user.active}"
                                  class="badge bg-danger">

                                Неактивен

                            </span>

                        </td>


                        <td class="text-end">

                            <!-- ДЕАКТИВИРАНЕ -->

                            <form th:if="${user.active}"
                                  th:action="@{/admin/users/{id}/deactivate(id=${user.id})}"
                                  method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Сигурни ли сте, че искате да деактивирате този потребител?');">

                                <button type="submit"
                                        class="btn btn-sm btn-danger">

                                    Деактивирай

                                </button>

                            </form>


                            <!-- АКТИВИРАНЕ -->

                            <form th:unless="${user.active}"
                                  th:action="@{/admin/users/{id}/activate(id=${user.id})}"
                                  method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Искате ли да активирате този потребител?');">

                                <button type="submit"
                                        class="btn btn-sm btn-success">

                                    Активирай

                                </button>

                            </form>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


</body>

</html>
```
