<!DOCTYPE html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Управление на услуги | TA&CO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/admin}">
            TA&CO Admin
        </a>

        <a class="btn btn-outline-light"
           th:href="@{/admin}">
            ← Назад
        </a>

    </div>

</nav>


<div class="container py-5">

    <div class="mb-5">

        <h1>
            Управление на услугите
        </h1>

        <p class="text-muted">
            Активирайте или деактивирайте услугите,
            които се предлагат на клиентите.
        </p>

    </div>


    <div class="row g-4">

        <div class="col-md-6"
             th:each="service : ${services}">

            <div class="card h-100 shadow-sm">

                <div class="card-body">

                    <h4 class="card-title"
                        th:text="#{'serviceType.' + ${service.serviceType}}">
                        Име на услугата
                    </h4>


                    <div class="mb-3">

                        <span th:if="${service.active}"
                              class="badge bg-success">

                            Активна

                        </span>

                        <span th:unless="${service.active}"
                              class="badge bg-danger">

                            Неактивна

                        </span>

                    </div>


                    <!-- DEACTIVATE -->

                    <form th:if="${service.active}"
                          th:action="@{/admin/services/{type}/deactivate(type=${service.serviceType})}"
                          method="post">

                        <button type="submit"
                                class="btn btn-outline-danger">

                            Деактивирай

                        </button>

                    </form>


                    <!-- ACTIVATE -->

                    <form th:unless="${service.active}"
                          th:action="@{/admin/services/{type}/activate(type=${service.serviceType})}"
                          method="post">

                        <button type="submit"
                                class="btn btn-outline-success">

                            Активирай

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
