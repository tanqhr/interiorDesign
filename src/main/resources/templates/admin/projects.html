<!DOCTYPE html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>
        Админ - Проекти
    </title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link rel="stylesheet"
          th:href="@{/admin.css}">

</head>


<body>


<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">


        <a class="navbar-brand"
           th:href="@{/admin}">
            TA&CO Admin
        </a>


        <a class="btn btn-outline-light"
           th:href="@{/admin}">
            Табло
        </a>


    </div>

</nav>




<div class="container py-5">


    <div class="welcome-box">


        <h1>
            Всички проекти
        </h1>


        <p>
            Управление на клиентски заявки и интериорни проекти.
        </p>


    </div>





    <div class="table-responsive">


        <table class="table table-hover align-middle">


            <thead>


            <tr>

                <th>
                    Клиент
                </th>


                <th>
                    Проект
                </th>


                <th>
                    Помещение
                </th>


                <th>
                    Услуга
                </th>


                <th>
                    Статус
                </th>


                <th>
                    Цена
                </th>


                <th>
                    Действия
                </th>


            </tr>


            </thead>




            <tbody>


            <tr th:each="project : ${projects}">


                <td>

                    <span th:text="${project.author.firstName
                    + ' ' + project.author.lastName}">
                        Иван Иванов
                    </span>

                </td>



                <td>

                    <strong th:text="${project.title}">
                        Модерен хол
                    </strong>

                </td>




                <td>

                    <span th:text="#{${'roomType.' + project.roomType.name()}}">
                        Хол
                    </span>

                </td>





                <td>

                    <span th:text="${project.serviceType}">
                        DESIGN_ONLY
                    </span>

                </td>





                <td>


                    <span class="badge bg-warning"
                          th:text="${project.status}">
                        NEW
                    </span>


                </td>





                <td>


                    <span th:if="${project.price != null}"
                          th:text="${project.price + ' лв.'}">
                        500 лв.
                    </span>


                    <span th:unless="${project.price != null}">
                        -
                    </span>


                </td>





                <td>


                    <a class="btn btn-dark btn-sm"
                       th:href="@{/admin/projects/{id}(id=${project.id})}">

                        Отвори

                    </a>


                </td>



            </tr>



            </tbody>


        </table>


    </div>


</div>



</body>

</html>
