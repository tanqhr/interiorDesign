<!DOCTYPE html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Плащане | TA&CO</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link rel="stylesheet"
        th:href="@{/css/payment.css}">

</head>


<body>


<nav class="navbar navbar-dark">

  <div class="container">

    <a class="navbar-brand"
       th:href="@{/}">
      TA&CO
    </a>

    <a th:href="@{/}"
       class="back-btn">
      ← Назад
    </a>

  </div>

</nav>


<div class="container payment-container">


  <div class="payment-card">


    <div class="payment-header">

            <span>
                ПЛАЩАНЕ
            </span>

      <h1>
        Завършете поръчката
      </h1>

    </div>


    <div class="project-summary">

      <h3 th:text="${project.title}">
        Име на проекта
      </h3>


      <p th:text="${project.description}">
        Описание на проекта
      </p>


      <div class="summary-row">

                <span>
                    Услуга
                </span>

        <strong th:text="#{'serviceType.' + ${project.serviceType}}">
          Интериорен дизайн
        </strong>

      </div>


      <div class="summary-row">

                <span>
                    Площ
                </span>

        <strong>

                    <span th:text="${project.area}">
                        100
                    </span>

          м²

        </strong>

      </div>


      <div class="summary-row total-row">

                <span>
                    Общо за плащане
                </span>

        <strong>

                    <span th:text="${project.price}">
                        2500
                    </span>

          евро

        </strong>

      </div>

    </div>


    <form th:action="@{/payment/{id}(id=${project.id})}"
          method="post">


      <div class="payment-method">

        <h4>
          Метод на плащане
        </h4>


        <div class="method-option">

          <input type="radio"
                 name="paymentMethod"
                 value="CARD"
                 checked>

          <label>
            💳 Банкова карта
          </label>

        </div>


        <div class="method-option">

          <input type="radio"
                 name="paymentMethod"
                 value="BANK_TRANSFER">

          <label>
            🏦 Банков превод
          </label>

        </div>

      </div>


      <button type="submit"
              class="pay-button">

        Плати

      </button>


    </form>


  </div>

</div>


</body>

</html>
