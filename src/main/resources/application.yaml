spring:
  datasource:
    url: jdbc:mysql://localhost:3306/interior_design?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: root
    password: 12345

  mail:
      host: smtp.abv.bg
      port: 465
      username: ${EMAIL_USERNAME}
      password: ${EMAIL_PASSWORD}
      properties:
        mail:
          smtp:
            auth: true
            ssl:
              enable: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  messages:
    basename: i18n/messages
    encoding: UTF-8

app:
    upload-dir: uploads